<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .game-container {
      max-width: 500px;
      width: 90%;
      margin: 2rem auto;
      text-align: center;
    }

    .title {
      font-size: 2.5em;
      margin-bottom: 1.5rem;
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
      }
      to {
        text-shadow: 0 0 20px rgba(255, 0, 85, 0.8),
                     0 0 30px rgba(255, 0, 85, 0.6);
      }
    }

    #symbol-selection {
      background: rgba(255, 255, 255, 0.1);
      padding: 2rem;
      border-radius: 15px;
      backdrop-filter: blur(10px);
      margin-bottom: 2rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    #symbol-selection h2 {
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
    }

    .symbol-btn {
      padding: 1rem 2rem;
      margin: 0.5rem;
      font-size: 1.5rem;
      font-weight: 600;
      color: white;
      background: linear-gradient(45deg, #ff0055, #ff00a2);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 0, 85, 0.3);
    }

    .symbol-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 0, 85, 0.4);
    }

    .game-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 2rem auto;
      max-width: 400px;
    }

    .cell {
      aspect-ratio: 1;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .cell:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .cell.x {
      color: #ff0055;
      text-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
    }

    .cell.o {
      color: #00a2ff;
      text-shadow: 0 0 10px rgba(0, 162, 255, 0.5);
    }

    .result {
      font-size: 1.5rem;
      margin: 1rem 0;
      min-height: 2rem;
    }

    .btn {
      padding: 1rem 2rem;
      font-size: 1.1rem;
      font-weight: 600;
      color: white;
      background: linear-gradient(45deg, #ff0055, #ff00a2);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 0, 85, 0.3);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 0, 85, 0.4);
    }

    .game-wrapper {
      background: rgba(255, 255, 255, 0.1);
      padding: 2rem;
      border-radius: 15px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .cell.animated {
      animation: pop 0.3s ease-out forwards;
    }

    @media (max-width: 480px) {
      .game-board {
        gap: 5px;
      }
      
      .cell {
        font-size: 2rem;
      }
      
      .title {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <h1 class="title">Tic Tac Toe</h1>
    
    <div id="symbol-selection">
      <h2>Choose Your Symbol</h2>
      <button class="symbol-btn" onclick="startGame('X')">X</button>
      <button class="symbol-btn" onclick="startGame('O')">O</button>
    </div>

    <div id="game-wrapper" class="game-wrapper" style="display: none;">
      <div class="game-board">
        <div class="cell" onclick="makeMove(this, 0, 0)"></div>
        <div class="cell" onclick="makeMove(this, 0, 1)"></div>
        <div class="cell" onclick="makeMove(this, 0, 2)"></div>
        <div class="cell" onclick="makeMove(this, 1, 0)"></div>
        <div class="cell" onclick="makeMove(this, 1, 1)"></div>
        <div class="cell" onclick="makeMove(this, 1, 2)"></div>
        <div class="cell" onclick="makeMove(this, 2, 0)"></div>
        <div class="cell" onclick="makeMove(this, 2, 1)"></div>
        <div class="cell" onclick="makeMove(this, 2, 2)"></div>
      </div>
      <div class="result" id="result"></div>
      <button class="btn" onclick="restartGame()">Restart Game</button>
    </div>
  </div>

  <script>
    let board = [
      ['', '', ''],
      ['', '', ''],
      ['', '', '']
    ];
    let currentPlayer;
    let userSymbol;
    let computerSymbol;
    let gameActive = true;

    function startGame(symbol) {
      userSymbol = symbol;
      computerSymbol = userSymbol === 'X' ? 'O' : 'X';
      currentPlayer = userSymbol;
      document.getElementById('symbol-selection').style.display = 'none';
      document.getElementById('game-wrapper').style.display = 'block';
    }

    function makeMove(cell, row, col) {
      if (board[row][col] !== '' || !gameActive || currentPlayer !== userSymbol) return;

      board[row][col] = currentPlayer;
      cell.textContent = currentPlayer;
      cell.classList.add(currentPlayer.toLowerCase(), 'animated');

      if (checkWinner()) {
        document.getElementById('result').textContent = `You win! 🎉`;
        gameActive = false;
        return;
      } else if (board.flat().every(cell => cell !== '')) {
        document.getElementById('result').textContent = `It's a draw! 🤝`;
        gameActive = false;
        return;
      }

      currentPlayer = computerSymbol;
      setTimeout(computerMove, 500);
    }

    function computerMove() {
      if (!gameActive) return;

      // Try to win
      let move = findWinningMove(computerSymbol);
      
      // Block player's winning move
      if (!move) {
        move = findWinningMove(userSymbol);
      }
      
      // Take center if available
      if (!move && board[1][1] === '') {
        move = [1, 1];
      }
      
      // Take a random corner
      if (!move) {
        const corners = [[0,0], [0,2], [2,0], [2,2]].filter(([r,c]) => board[r][c] === '');
        if (corners.length > 0) {
          move = corners[Math.floor(Math.random() * corners.length)];
        }
      }
      
      // Take any available space
      if (!move) {
        const emptyCells = [];
        for (let i = 0; i < 3; i++) {
          for (let j = 0; j < 3; j++) {
            if (board[i][j] === '') emptyCells.push([i, j]);
          }
        }
        if (emptyCells.length > 0) {
          move = emptyCells[Math.floor(Math.random() * emptyCells.length)];
        }
      }

      if (move) {
        const [row, col] = move;
        board[row][col] = computerSymbol;
        const cell = document.querySelector(`.game-board .cell:nth-child(${row * 3 + col + 1})`);
        cell.textContent = computerSymbol;
        cell.classList.add(computerSymbol.toLowerCase(), 'animated');

        if (checkWinner()) {
          document.getElementById('result').textContent = `Computer wins! 🤖`;
          gameActive = false;
          return;
        } else if (board.flat().every(cell => cell !== '')) {
          document.getElementById('result').textContent = `It's a draw! 🤝`;
          gameActive = false;
          return;
        }
      }

      currentPlayer = userSymbol;
    }

    function findWinningMove(player) {
      for (let i = 0; i < 3; i++) {
        for (let j = 0; j < 3; j++) {
          if (board[i][j] === '') {
            board[i][j] = player;
            if (checkWinner()) {
              board[i][j] = '';
              return [i, j];
            }
            board[i][j] = '';
          }
        }
      }
      return null;
    }

    function checkWinner() {
      // Check rows, columns and diagonals
      for (let i = 0; i < 3; i++) {
        if (board[i][0] && board[i][0] === board[i][1] && board[i][0] === board[i][2]) return true;
        if (board[0][i] && board[0][i] === board[1][i] && board[0][i] === board[2][i]) return true;
      }
      if (board[0][0] && board[0][0] === board[1][1] && board[0][0] === board[2][2]) return true;
      if (board[0][2] && board[0][2] === board[1][1] && board[0][2] === board[2][0]) return true;
      return false;
    }

    function restartGame() {
      board = [['', '', ''], ['', '', ''], ['', '', '']];
      gameActive = true;
      currentPlayer = userSymbol;
      document.getElementById('result').textContent = '';
      document.querySelectorAll('.cell').forEach(cell => {
        cell.textContent = '';
        cell.className = 'cell';
      });
    }
  </script>
</body>
</html>
