<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ language.capitalize() }} - {{ level.capitalize() }} Projects</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #818cf8;
            --background-color: #f3f4f6;
            --card-background: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--background-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            color: var(--text-primary);
        }

        .container {
            max-width: 800px;
            width: 100%;
            background-color: var(--card-background);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 2rem;
        }

        .projects-list {
            list-style: none;
            display: grid;
            gap: 1.5rem;
        }

        .project-card {
            background-color: #f8fafc;
            border-radius: 0.75rem;
            padding: 1.5rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .project-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .project-name {
            color: var(--primary-color);
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .project-description {
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            margin-top: 2rem;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--secondary-color);
        }

        .back-link::before {
            content: '←';
            margin-right: 0.5rem;
            font-size: 1.2em;
        }

        .language-icon {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        @media (max-width: 640px) {
            .container {
                padding: 1.5rem;
            }

            h1 {
                font-size: 2rem;
            }

            .project-card {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="language-icon" id="languageIcon">🚀</div>
            <h1>{{ language.capitalize() }} - {{ level.capitalize() }} Projects</h1>
            <p class="subtitle">Explore curated projects designed for your skill level</p>
        </div>

        <ul class="projects-list">
            {% for project in projects %}
                <li class="project-card">
                    <div class="project-name">{{ project.name }}</div>
                    <p class="project-description">{{ project.description }}</p>
                </li>
            {% endfor %}
        </ul>
        <a href="/courses" class="back-link">Back to Courses</a>
    </div>

    <script>
        // Update language icon based on the current language
        const icons = {
            'python': '🐍',
            'c': '⚙️',
            'cpp': '⚡',
            'java': '☕',
            'javascript': '💻'
        };
        
        const currentLanguage = '{{ language }}'.toLowerCase();
        const languageIcon = document.getElementById('languageIcon');
        
        if (currentLanguage in icons) {
            languageIcon.textContent = icons[currentLanguage];
        }
    </script>
</body>
</html>
