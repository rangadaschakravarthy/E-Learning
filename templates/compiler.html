<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnPro | Online Compiler</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.12/ace.js"></script>
    <style>
        :root {
            --primary-color: #4F46E5;
            --secondary-color: #818CF8;
            --background-color: #F3F4F6;
            --editor-bg: #1E1E1E;
            --text-primary: #1F2937;
            --text-secondary: #6B7280;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background-color: var(--background-color);
        }

        .left-panel {
            width: 40%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .left-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=1000&q=80') center/cover;
            opacity: 0.1;
        }

        .left-content {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 440px;
            margin: 0 auto;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .left-content h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            line-height: 1.4;
        }

        .left-content p {
            font-size: 1.1rem;
            line-height: 1.6;
            opacity: 0.9;
        }

        .compiler-panel {
            width: 60%;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .compiler-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .compiler-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
        }

        .language-select {
            position: relative;
            width: 200px;
        }

        select {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            border: 1px solid #E5E7EB;
            border-radius: 0.5rem;
            appearance: none;
            background: white;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .language-select::after {
            content: '\f107';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
        }

        #editor {
            height: 400px;
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 1rem;
        }

        .action-bar {
            display: flex;
            gap: 1rem;
            margin: 1rem 0;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
        }

        .output-container {
            flex-grow: 1;
            background: var(--editor-bg);
            border-radius: 0.75rem;
            padding: 1rem;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.9rem;
            color: #E5E7EB;
            overflow: auto;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .output-container:empty::before {
            content: 'Output will appear here...';
            color: #6B7280;
            font-style: italic;
        }

        @media (max-width: 1024px) {
            body {
                flex-direction: column;
            }
            .left-panel, .compiler-panel {
                width: 100%;
            }
            .left-panel {
                padding: 2rem 1rem;
            }
            #editor {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="left-panel">
        <div class="left-content">
            <h1>Code. Create. Innovate.</h1>
            <p>Write, compile, and run your code in multiple programming languages. Perfect for learning, practicing, and quick prototyping.</p>
        </div>
    </div>

    <div class="compiler-panel">
        <div class="compiler-header">
            <h1>Online Compiler</h1>
            <div class="language-select">
                <select id="language" onchange="updateEditorMode()">
                    <option value="Python">Python</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="C++">C++</option>
                    <option value="Java">Java</option>
                    <option value="C">C</option>
                </select>
            </div>
        </div>

        <div id="editor"></div>

        <div class="action-bar">
            <button class="btn btn-primary" onclick="runCode()">
                <i class="fas fa-play"></i>
                Run Code
            </button>
        </div>

        <pre id="output" class="output-container"></pre>
    </div>

    <script>
        // Initialize Ace Editor
        const editor = ace.edit("editor");
        editor.setTheme("ace/theme/monokai");
        editor.session.setMode("ace/mode/python");
        editor.setFontSize(14);
        editor.setShowPrintMargin(false);
        editor.session.setTabSize(4);
        editor.session.setUseSoftTabs(true);

        // Add some default code for Python
        editor.setValue(`# Write your code here
print("Hello, World!")`, 1);

        // Language-specific default code
        const defaultCode = {
            Python: `# Write your code here
print("Hello, World!")`,
            JavaScript: `// Write your code here
console.log("Hello, World!");`,
            "C++": `#include <iostream>
using namespace std;

int main() {
    cout << "Hello, World!" << endl;
    return 0;
}`,
            Java: `class Main {
    public static void main(String[] args) {
        System.out.println("Hello, World!");
    }
}`,
            C: `#include <stdio.h>

int main() {
    printf("Hello, World!\\n");
    return 0;
}`
        };

        function updateEditorMode() {
            const language = document.getElementById("language").value;
            const modes = {
                Python: "python",
                JavaScript: "javascript",
                "C++": "c_cpp",
                Java: "java",
                C: "c_cpp"
            };
            
            editor.session.setMode(`ace/mode/${modes[language]}`);
            editor.setValue(defaultCode[language], 1);
        }

        async function runCode() {
            const runButton = document.querySelector('.btn-primary');
            const originalContent = runButton.innerHTML;
            runButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Running...';
            runButton.disabled = true;

            try {
                const code = editor.getValue();
                const language = document.getElementById("language").value;

                const response = await fetch('/execute', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ code, language })
                });

                const result = await response.json();
                document.getElementById('output').textContent = result.output || result.error;
            } catch (error) {
                document.getElementById('output').textContent = 'Error: Failed to execute code';
            } finally {
                runButton.innerHTML = originalContent;
                runButton.disabled = false;
            }
        }

        // Handle Ctrl+Enter to run code
        editor.commands.addCommand({
            name: 'runCode',
            bindKey: {win: 'Ctrl-Enter', mac: 'Command-Enter'},
            exec: runCode
        });
    </script>
</body>
</html>
