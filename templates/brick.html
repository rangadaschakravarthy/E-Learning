<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Brick Breaker</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      font-family: 'Press Start 2P', cursive;
      color: #fff;
    }

    .game-container {
      position: relative;
      margin: 20px;
    }

    canvas {
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      background-color: rgba(0, 0, 0, 0.8);
      display: none;
    }

    .controls {
      text-align: center;
      margin-top: 20px;
    }

    .btn {
      padding: 15px 30px;
      font-size: 16px;
      font-family: 'Press Start 2P', cursive;
      background: linear-gradient(45deg, #ff0055, #ff00a2);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 5px 15px rgba(255, 0, 85, 0.3);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 0, 85, 0.4);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .title {
      font-size: 2.5em;
      margin-bottom: 20px;
      text-align: center;
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
      animation: glow 2s ease-in-out infinite alternate;
    }

    .instructions {
      margin: 20px 0;
      font-size: 0.8em;
      color: #ccc;
      text-align: center;
      line-height: 1.6;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
      }
      to {
        text-shadow: 0 0 20px rgba(255, 0, 85, 0.8),
                     0 0 30px rgba(255, 0, 85, 0.6);
      }
    }

    .score-display {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 1em;
      color: #fff;
      text-shadow: 0 0 5px rgba(255, 0, 85, 0.5);
    }

    .game-over {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      background: rgba(0, 0, 0, 0.9);
      padding: 30px;
      border-radius: 10px;
      border: 2px solid #ff0055;
    }

    .game-over h2 {
      color: #ff0055;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <h1 class="title">Retro Brick Breaker</h1>
  
  <div class="game-container">
    <canvas id="brickBreaker" width="800" height="600"></canvas>
    <div id="gameOver" class="game-over">
      <h2>Game Over!</h2>
      <p id="finalScore"></p>
      <button class="btn" onclick="restartGame()">Play Again</button>
    </div>
  </div>

  <div class="controls">
    <button id="startGame" class="btn">Start Game</button>
    <p class="instructions">
      Use ← → arrow keys to move the paddle<br>
      Break all bricks to win!
    </p>
  </div>

  <script>
    const canvas = document.getElementById('brickBreaker');
    const ctx = canvas.getContext('2d');
    const startButton = document.getElementById('startGame');
    const gameOverScreen = document.getElementById('gameOver');

    // Game objects
    const paddle = {
      x: canvas.width / 2 - 50,
      y: canvas.height - 30,
      width: 100,
      height: 15,
      dx: 0,
      speed: 8
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height - 50,
      radius: 8,
      dx: 4,
      dy: -4,
      speed: 4
    };

    // Brick configuration
    const brickConfig = {
      rows: 5,
      cols: 10,
      width: 70,
      height: 20,
      padding: 10,
      offsetTop: 60,
      offsetLeft: 45
    };

    // Colors for bricks (gradient from top to bottom)
    const brickColors = [
      '#ff0055',
      '#ff0088',
      '#ff00aa',
      '#ff00cc',
      '#ff00ff'
    ];

    // Create bricks array
    const bricks = [];
    for (let r = 0; r < brickConfig.rows; r++) {
      for (let c = 0; c < brickConfig.cols; c++) {
        const brickX = c * (brickConfig.width + brickConfig.padding) + brickConfig.offsetLeft;
        const brickY = r * (brickConfig.height + brickConfig.padding) + brickConfig.offsetTop;
        bricks.push({
          x: brickX,
          y: brickY,
          status: 1,
          color: brickColors[r]
        });
      }
    }

    let score = 0;
    let gameInterval;
    let particles = [];

    // Particle system for effects
    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.size = Math.random() * 3 + 2;
        this.speedX = Math.random() * 6 - 3;
        this.speedY = Math.random() * 6 - 3;
        this.life = 1;
      }

      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.life -= 0.02;
        this.size -= 0.1;
      }

      draw() {
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.life;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function createParticles(x, y, color) {
      for (let i = 0; i < 15; i++) {
        particles.push(new Particle(x, y, color));
      }
    }

    function drawPaddle() {
      ctx.fillStyle = '#ff0055';
      ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
      
      // Add gradient effect to paddle
      const gradient = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.height);
      gradient.addColorStop(0, '#ff0055');
      gradient.addColorStop(1, '#ff00a2');
      ctx.fillStyle = gradient;
      ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
    }

    function drawBall() {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.closePath();

      // Add glow effect
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius + 2, 0, Math.PI * 2);
      ctx.strokeStyle = '#ff0055';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.closePath();
    }

    function drawBricks() {
      bricks.forEach(brick => {
        if (brick.status === 1) {
          ctx.fillStyle = brick.color;
          ctx.fillRect(brick.x, brick.y, brickConfig.width, brickConfig.height);
          
          // Add shine effect
          ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
          ctx.fillRect(brick.x, brick.y, brickConfig.width, brickConfig.height / 2);
        }
      });
    }

    function drawScore() {
      ctx.font = '20px "Press Start 2P"';
      ctx.fillStyle = '#fff';
      ctx.fillText(`Score: ${score}`, 20, 30);
    }

    function movePaddle() {
      paddle.x += paddle.dx;

      if (paddle.x < 0) paddle.x = 0;
      if (paddle.x + paddle.width > canvas.width) {
        paddle.x = canvas.width - paddle.width;
      }
    }

    function updateBall() {
      ball.x += ball.dx;
      ball.y += ball.dy;

      // Wall collision
      if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
        ball.dx *= -1;
        createParticles(ball.x, ball.y, '#fff');
      }
      
      if (ball.y - ball.radius < 0) {
        ball.dy *= -1;
        createParticles(ball.x, ball.y, '#fff');
      }

      // Paddle collision
      if (
        ball.y + ball.radius > paddle.y &&
        ball.y + ball.radius < paddle.y + paddle.height &&
        ball.x > paddle.x &&
        ball.x < paddle.x + paddle.width
      ) {
        // Calculate bounce angle based on where ball hits paddle
        let hitPoint = (ball.x - (paddle.x + paddle.width/2)) / (paddle.width/2);
        ball.dx = hitPoint * ball.speed;
        ball.dy = -ball.dy;
        createParticles(ball.x, ball.y, '#ff0055');
      }

      // Brick collision
      bricks.forEach(brick => {
        if (brick.status === 1) {
          if (
            ball.x > brick.x &&
            ball.x < brick.x + brickConfig.width &&
            ball.y > brick.y &&
            ball.y < brick.y + brickConfig.height
          ) {
            ball.dy *= -1;
            brick.status = 0;
            score += 10;
            createParticles(ball.x, ball.y, brick.color);

            // Speed up ball slightly
            if (ball.dx > 0) ball.dx += 0.1;
            else ball.dx -= 0.1;
            if (ball.dy > 0) ball.dy += 0.1;
            else ball.dy -= 0.1;
          }
        }
      });

      // Game Over
      if (ball.y + ball.radius > canvas.height) {
        endGame();
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        if (particles[i].life <= 0 || particles[i].size <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function drawParticles() {
      particles.forEach(particle => particle.draw());
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBricks();
      drawPaddle();
      drawBall();
      drawScore();
      drawParticles();
    }

    function update() {
      movePaddle();
      updateBall();
      updateParticles();
      draw();
    }

    function endGame() {
      clearInterval(gameInterval);
      gameOverScreen.style.display = 'block';
      document.getElementById('finalScore').textContent = `Final Score: ${score}`;
    }

    function restartGame() {
      score = 0;
      ball.x = canvas.width / 2;
      ball.y = canvas.height - 50;
      ball.dx = 4;
      ball.dy = -4;
      paddle.x = canvas.width / 2 - 50;
      particles = [];
      
      // Reset bricks
      bricks.forEach(brick => brick.status = 1);
      
      gameOverScreen.style.display = 'none';
      gameInterval = setInterval(update, 1000/60);
    }

    // Event listeners
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') paddle.dx = -paddle.speed;
      if (e.key === 'ArrowRight') paddle.dx = paddle.speed;
    });

    document.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') paddle.dx = 0;
    });

    startButton.addEventListener('click', () => {
      startButton.style.display = 'none';
      canvas.style.display = 'block';
      gameInterval = setInterval(update, 1000/60);
    });
  </script>
</body>
</html>
